version: '3.8'

services:
  # PostgreSQL Database Primary
  postgres:
    image: postgres:16-alpine
    container_name: swapnojatri_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: swapnojatri_user
      POSTGRES_PASSWORD: swapnojatri_secure_pass_2026
      POSTGRES_DB: swapnojatri_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swapnojatri_user -d swapnojatri_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Broker
  redis:
    image: redis:7-alpine
    container_name: swapnojatri_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO Local S3 Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: swapnojatri_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # FastAPI Backend API Server
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: swapnojatri_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://swapnojatri_user:swapnojatri_secure_pass_2026@postgres:5432/swapnojatri_db
      SYNC_DATABASE_URL: postgresql+psycopg2://swapnojatri_user:swapnojatri_secure_pass_2026@postgres:5432/swapnojatri_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"

  # Celery Async Background Worker
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: swapnojatri_celery_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -c 4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://swapnojatri_user:swapnojatri_secure_pass_2026@postgres:5432/swapnojatri_db
      SYNC_DATABASE_URL: postgresql+psycopg2://swapnojatri_user:swapnojatri_secure_pass_2026@postgres:5432/swapnojatri_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000

  # Celery Beat Scheduler (Periodic reconciliation & reservation cleanup)
  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: swapnojatri_celery_beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://swapnojatri_user:swapnojatri_secure_pass_2026@postgres:5432/swapnojatri_db
      SYNC_DATABASE_URL: postgresql+psycopg2://swapnojatri_user:swapnojatri_secure_pass_2026@postgres:5432/swapnojatri_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

  # Nginx Ingress Proxy
  nginx:
    image: nginx:alpine
    container_name: swapnojatri_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
