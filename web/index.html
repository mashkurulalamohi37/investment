<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Swapnojatri - Asset-Backed Fractional Land Investment Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Swapnojatri">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Swapnojatri • Asset-Backed Land Investment</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FFFFFF;
      z-index: 99999;
      transition: opacity 0.35s ease-out;
    }
    .emblem {
      width: 52px;
      height: 52px;
      background: #0F8A4F;
      border: 1.5px solid #0F8A4F;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 700;
      font-family: 'Times New Roman', Georgia, serif;
      box-shadow: 0 10px 24px rgba(15, 138, 79, 0.18);
      margin-bottom: 16px;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #141613;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }
    .brand-sub {
      font-size: 10px;
      color: #8D9388;
      letter-spacing: 0.8px;
      margin-bottom: 22px;
      text-transform: uppercase;
      font-weight: 500;
    }
    .progress-bar-container {
      width: 130px;
      height: 3px;
      background: #E7EAE4;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #0F8A4F, #2FBE7A);
      border-radius: 3px;
      animation: pulse-bar 1.1s infinite ease-in-out;
    }
    @keyframes pulse-bar {
      0% { left: -40%; width: 40%; }
      50% { width: 60%; }
      100% { left: 100%; width: 40%; }
    }
  </style>
</head>
<body>
  <div id="preloader">
    <div class="emblem">স্ব</div>
    <div class="brand-title">SWAPNOJATRI</div>
    <div class="brand-sub">Asset-Backed Land Investment</div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>
  </div>
  <script>
    window.addEventListener('load', function() {
      var checkFlutter = setInterval(function() {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
          clearInterval(checkFlutter);
          var p = document.getElementById('preloader');
          if (p) {
            p.style.opacity = '0';
            setTimeout(function() {
              if (p && p.parentNode) p.parentNode.removeChild(p);
            }, 350);
          }
        }
      }, 40);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
