<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Land Base -->
  <rect width="400" height="240" fill="#F4F6F0" />

  <!-- Road Grid & Secondary Routes -->
  <path d="M 0,60 Q 150,80 400,40" stroke="#FFFFFF" stroke-width="8" fill="none" />
  <path d="M 120,0 L 140,240" stroke="#FFFFFF" stroke-width="6" fill="none" />
  <path d="M 280,0 L 260,240" stroke="#FFFFFF" stroke-width="5" fill="none" />
  <path d="M 0,180 Q 200,160 400,200" stroke="#FFFFFF" stroke-width="7" fill="none" />

  <!-- Green Parcels -->
  <rect x="20" y="80" width="90" height="70" rx="8" fill="#DCFCE7" opacity="0.7" />
  <rect x="280" y="90" width="100" height="80" rx="8" fill="#DCFCE7" opacity="0.6" />
  <rect x="30" y="190" width="80" height="40" rx="6" fill="#DCFCE7" opacity="0.5" />

  <!-- River (Buriganga / Bosila Channel) -->
  <path d="M -10,100 C 80,80 180,120 410,60 L 410,110 C 240,150 120,130 -10,150 Z" fill="url(#riverGrad)" />

  <!-- River Label -->
  <text x="145" y="110" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369A1" letter-spacing="1">BOSILA RIVER</text>

  <!-- Bosila Bridge Overlay -->
  <rect x="230" y="68" width="16" height="58" rx="3" fill="#64748B" transform="rotate(-15, 238, 97)" />
  <text x="210" y="60" font-family="sans-serif" font-size="9" font-weight="900" fill="#334155" letter-spacing="0.5">BOSILA BRIDGE</text>

  <!-- Main Tower Road (Connecting from bridge into Washpur) -->
  <path d="M 242,100 C 240,140 210,170 190,220" stroke="#FDE047" stroke-width="7" fill="none" />
  <path d="M 242,100 C 240,140 210,170 190,220" stroke="#EAB308" stroke-width="2" stroke-dasharray="4,4" fill="none" />

  <!-- Highway Badge -->
  <rect x="150" y="170" width="22" height="14" rx="3" fill="#0284C7" />
  <text x="154" y="180" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">N5</text>

  <!-- Location Pin (Washpur Dhaka) -->
  <g transform="translate(195, 140)" filter="url(#pinShadow)">
    <circle cx="15" cy="30" r="8" fill="#000000" opacity="0.15" />
    <!-- Pin Marker -->
    <path d="M 15,0 C 7,0 0,7 0,15 C 0,26 15,38 15,38 C 15,38 30,26 30,15 C 30,7 23,0 15,0 Z" fill="#EF4444" />
    <circle cx="15" cy="14" r="6" fill="#FFFFFF" />
    <circle cx="15" cy="14" r="3" fill="#EF4444" />
  </g>

  <!-- Location Text Label -->
  <rect x="228" y="148" width="95" height="34" rx="6" fill="#FFFFFF" opacity="0.95" filter="url(#pinShadow)" />
  <text x="236" y="162" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Washpur</text>
  <text x="236" y="175" font-family="sans-serif" font-size="9" font-weight="medium" fill="#64748B">Dhaka, Bosila</text>
</svg>
