<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Suitcase Gradient -->
    <linearGradient id="suitcaseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="70%" stop-color="#0F2F57" />
      <stop offset="100%" stop-color="#061224" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.35" flood-color="#000" />
    </filter>
  </defs>

  <!-- Suitcase Top Handle -->
  <path d="M 190 90 L 190 35 C 190 20, 210 10, 250 10 C 290 10, 310 20, 310 35 L 310 90 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 205 90 L 205 55 C 205 45, 215 38, 250 38 C 285 38, 295 45, 295 55 L 295 90 Z" 
        fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Main Suitcase Body Outline (White Border) -->
  <rect x="90" y="80" width="320" height="390" rx="45" ry="45" 
        fill="url(#suitcaseGradient)" stroke="#FFFFFF" stroke-width="16" />

  <!-- Backpacker Silhouette Accent Inside Sky -->
  <g opacity="0.25">
    <circle cx="250" cy="200" r="40" fill="#000000" />
    <path d="M 210 280 Q 250 220 290 280 Z" fill="#000000" />
  </g>

  <!-- Flying Birds Flock -->
  <!-- Bird 1 -->
  <path d="M 145 230 Q 155 218 165 228 Q 175 218 185 230 Q 175 223 165 233 Q 155 223 145 230 Z" fill="#06182E" />
  <!-- Bird 2 -->
  <path d="M 195 210 Q 205 198 215 208 Q 225 198 235 210 Q 225 203 215 213 Q 205 203 195 210 Z" fill="#06182E" />
  <!-- Bird 3 -->
  <path d="M 245 205 Q 255 195 265 203 Q 275 195 285 205 Q 275 200 265 208 Q 255 200 245 205 Z" fill="#06182E" />
  <!-- Bird 4 -->
  <path d="M 290 195 Q 298 186 306 193 Q 314 186 322 195 Q 314 190 306 198 Q 298 190 290 195 Z" fill="#06182E" />
  <!-- Bird 5 -->
  <path d="M 325 180 Q 332 172 339 178 Q 346 172 353 180 Q 346 175 339 182 Q 332 175 325 180 Z" fill="#06182E" />

  <!-- Bottom Suitcase Wheels/Legs -->
  <rect x="145" y="470" width="30" height="25" rx="6" fill="#FFFFFF" />
  <rect x="325" y="470" width="30" height="25" rx="6" fill="#FFFFFF" />

  <!-- Dynamic Paper Airplane Arrow (Pointing Up-Right) -->
  <g filter="url(#shadow)">
    <!-- Trail Line -->
    <path d="M 360 300 L 440 210" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />
    <path d="M 360 300 L 440 210" stroke="#0284C7" stroke-width="10" stroke-linecap="round" />
    
    <!-- Paper Plane Head -->
    <polygon points="485,160 380,240 425,275" fill="#0284C7" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" />
    <polygon points="485,160 410,230 460,250" fill="#38BDF8" />
  </g>

  <!-- Diagonal Signature Banner for "স্বপ্নযাত্রী" -->
  <g filter="url(#shadow)" transform="rotate(-12, 250, 310)">
    <!-- Banner Shadow/Outer Ribbon -->
    <path d="M 25 280 L 470 280 L 460 350 L 15 350 Z" fill="#061A36" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round" />

    <!-- Ribbon Left Notch -->
    <polygon points="15,350 45,315 25,280" fill="#0284C7" />
    <!-- Ribbon Right Notch -->
    <polygon points="470,280 440,315 460,350" fill="#0284C7" />

    <!-- Stylized Bengali Text "স্বপ্নযাত্রী" -->
    <text x="245" y="336" 
          font-family="'Hind Siliguri', 'Galada', sans-serif" 
          font-weight="900" 
          font-size="68" 
          fill="#FFFFFF" 
          text-anchor="middle"
          stroke="#061A36" 
          stroke-width="3"
          letter-spacing="2">
      স্বপ্নযাত্রী
    </text>
  </g>
</svg>
